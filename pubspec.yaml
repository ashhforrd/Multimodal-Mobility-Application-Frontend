name: langkah_sahabat
description: Prototipe navigasi berjalan kaki multimodal untuk Tugas Akhir.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  geolocator: ^13.0.2
  permission_handler: ^11.4.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
  http: ^1.3.0
  flutter_dotenv: ^5.2.1
  uuid: ^4.5.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  lucide_icons_flutter: ^3.1.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Regular.otf
          weight: 400
        - asset: assets/fonts/Satoshi-Medium.otf
          weight: 500
        - asset: assets/fonts/Satoshi-Bold.otf
          weight: 700
